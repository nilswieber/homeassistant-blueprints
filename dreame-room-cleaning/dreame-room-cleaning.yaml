blueprint:
  name: Dreame Room Cleaning
  description: > 
    Tracks the cleaned rooms per day. Allows to start a cleaning based on uncleaned rooms for that day.

    # Start the cleaning

    To start a cleaning trigger the event: `start-room-cleaning`.

    The event data has to contain `vacuum: vacuum.your_vacuum`.

    You can additionally pass `prefered_cleaning_mode: sweeping` and chosse from `sweeping`,`mopping` and `sweeping_and_mopping`
  domain: automation
  input:
    vacuum_entity:
      name: Vacuum
      selector:
        entity:
          filter:
            domain:
            - vacuum
          multiple: false
    todo_list_entity:
      name: ToDo-List
      description: >
        An (empty) ToDo-List, which will be used to store the state of the rooms and to indicate, which shall be cleaned.
      selector:
        entity:
          filter:
            domain:
            - todo
          multiple: false
    cleaned_area_entity:
      name: Cleaned Area Sensor
      selector:
        entity:
          filter:
            domain:
            - sensor
          multiple: false
    current_room_entity:
      name: Current Room Sensor
      selector:
        entity:
          filter:
            domain:
            - sensor
          multiple: false
    room_overrides:
      name: Room Settings
      default: []
      selector:
        object:
          label_field: id
          description_field: label
          multiple: true
          fields:
            id:
              label: Room ID
              required: true
              selector:
                number:
            label:
              label: Room Label (Optional)
              required: false
              selector:
                text:
            threshold_area:
              label: Threshold Area (Optional)
              required: false
              selector:
                number:
            default_cleaning_mode:
              label: Default Cleaning Mode (Optional)
              required: false
              selector:
                select:
                  options:
                    - sweeping
                    - mopping
                    - sweeping_and_mopping
            occupancy_entity:
              label: "[Occupancy] Entity (Optional)"
              required: false
              selector:
                entity:
                  filter:
                    domain: binary_sensor
                    device_class: occupancy
            occupancy_threshold:
              label: "[Occupancy] Reclean After Minutes (Optional)"
              required: false
              selector:
                number:
            self_clean_afterwards:
              label: "Self Clean After Room"
              required: false
              selector:
                boolean:
            cleaning_priority:
              label: "Cleaning Priority"
              selector:
                number:
    occupancy_sensors:
      name: All Used Occupancy Sensors
      description: >
        Due to technical reasons **all** Occupancy Entities listed in the *Room Settings* have to be specified here to be detected.
      default: []
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: occupancy
          multiple: true
    persons:
      name: Persons
      description: >
        Persons, which trigger a cleaning after they have all left.

        *Only works if the Zone is set*
      selector:
        entity:
          filter:
            domain: person
          multiple: true
      default: []
    home_zone:
      name: Zone (Home)
      description: >
        If set it triggers a cleaning after all specified Persons have left.

        **Note:** the zone must be an *active* zone (i.e. it is reflected in the
        state of the person entities). Passive zones are not detected reliably.
      selector:
        entity:
          filter:
            domain: zone
          multiple: false
      default: []
    leave_duration:
      name: Zone Leave - Start Cleaning Delay
      description: >
        Delay after which a cleaning is initiated after all specified Persons have left the Zone.
      selector:
        duration:
      default:
        hours: 0
        minutes: 0
        seconds: 0
    enter_duration:
      name: Zone Enter - Stop Cleaning Delay
      description: >
        Delay after which a cleaning is stopped if a Person enters the zone during the cleaning.
      selector:
        duration:
      default:
        hours: 0
        minutes: 0
        seconds: 0
    skip_self_clean_progress_threshold:
      name: Skip Self Clean - Progress Threshold
      description: >
        Skips the Self Cleaning configured for a room, if the cleaning progress is greater or equal the specified threshold.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
      default: 95
    cleaning_order:
      name: Cleaning Order
      description: >
        Defines in which order the rooms are cleaned
      selector:
        select:
          options:
            - label: "Order of ToDo-List"
              value: "todo"
            - label: "Last Complete Clean"
              value: "last_complete_clean"
      default: "todo"
    continue_room_threshold:
      name: Continue Room - Threshold
      description: >
        Defines the threshold of the cleaning progress for a room, after which the vacuum shall still continue with the current room cleaning before stopping after leaving the finished room. The room progress depends on the configured *Threshold Area* of the room.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
      default: 100
    pre_cleaning_actions:
      name: Pre Cleaning - Actions
      selector:
        action:
      default: []
    room_finished_actions:
      name: Room finished - Actions
      description: >
        Defines actions, which are executed if a finished room is left.

        The finished room is exposed in the `room` variable.
      selector:
        action:
      default: []
variables:
  vacuum_entity: !input vacuum_entity
  todo_list_entity: !input todo_list_entity
  cleaned_area_entity: !input cleaned_area_entity
  current_room_entity: !input current_room_entity
  persons: !input persons
  home_zone: !input home_zone
  skip_self_clean_progress_threshold: !input skip_self_clean_progress_threshold
  cleaning_order: !input cleaning_order
  continue_room_threshold: !input continue_room_threshold
triggers:
  - trigger: time
    at: "00:00:00"
    id: new-day
  - trigger: event
    event_type: start-room-cleaning
    event_data:
      vacuum: !input vacuum_entity
    id: start-room-cleaning
  - trigger: state
    entity_id:
      - !input cleaned_area_entity
    to: null
    id: area-change
  - trigger: state
    entity_id: !input occupancy_sensors
    to: null
    id: occupancy-change
  # FIX: `to: null` added -> attribute-only changes (GPS pings) no longer
  # trigger, which previously reset the `for:` timer on every position update
  # and made leave_duration/enter_duration effectively useless.
  - trigger: state
    entity_id: !input persons
    to: null
    id: persons-change-leave
    for: !input leave_duration
  - trigger: state
    entity_id: !input persons
    to: null
    id: persons-change-enter
    for: !input enter_duration
  - trigger: state
    entity_id:
      - !input current_room_entity
    to: null
    id: room-change
  - trigger: time_pattern
    minutes: "*"
    id: stop-watchdog
conditions: []
actions:
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: "{{ todo_list_entity }}"
    response_variable: items_to_clean
  - if:
      - condition: template
        value_template: "{{ items_to_clean[todo_list_entity]['items'] |count <= 0 }}"
    then:
      - variables:
          map_name: "{{ state_attr(vacuum_entity,'rooms') |first }}"
          vacuum_rooms: "{{ state_attr(vacuum_entity,'rooms')[map_name] }}"
          room_count: "{{ vacuum_rooms |count }}"
      - repeat:
          count: "{{ room_count }}"
          sequence:
            - variables:
                vacuum_room: "{{ vacuum_rooms[repeat.index -1] }}"
                room_definition: >-
                  {{ {"id": vacuum_room.id, "threshold_area": -1} }}
            - action: todo.add_item
              target:
                entity_id: "{{ todo_list_entity }}"
              data:
                item: "{{ vacuum_room.name }}"
                description: "{{ room_definition |to_json }}"
  - variables:
      room_overrides: !input room_overrides
      vacuum_device_id: "{{ device_attr(vacuum_entity,'id') }}"
      all_room_definitions: >-
        {{ items_to_clean[todo_list_entity]['items']| map(attribute='description') | map('from_json') | list }}
      # FIX: room_id kann als String geliefert werden -> Vergleich mit den
      # (numerischen) Raum-IDs aus der ToDo-Beschreibung schlug dann fehl und
      # current_room blieb leer, wodurch das Stop-Flag nie gesetzt wurde.
      current_room_id: >-
        {{ state_attr(current_room_entity,'room_id') | int(-1) }}
      cleaning_progress_entity: >-
        {{ device_entities(vacuum_device_id) | select('match','sensor\..*_cleaning_progress') |list |first }}
      cleaning_count_entity: >-
        {{ device_entities(vacuum_device_id) | select('match','sensor\..*_cleaning_count') |list |first }}
      self_clean_entity: >-
        {{ device_entities(vacuum_device_id) | select('match','button\..*_self_clean') |list |first }}
      state_entity: >-
        {{ device_entities(vacuum_device_id) | select('match','sensor\..*_state') |list |first }}
      cleaning_progress: "{{ states(cleaning_progress_entity) }}"
      cleaning_count: "{{ states(cleaning_count_entity) }}"
      state: "{{ states(state_entity) }}"
      clean_cycle: "{{ cleaning_count + 1 }}"
  - repeat:
      count: "{{ all_room_definitions | count }}"
      sequence:
        - variables:
            room_definition: "{{ all_room_definitions[repeat.index - 1] }}"
            room_override: "{{ room_overrides | selectattr('id','eq',room_definition.id) | list}}"
        - if:
            - condition: template
              value_template: "{{ room_override |count > 0 }}"
          then:
            - variables:
                room_definition: >-
                  {{ room_definition | combine(room_override | first) }}                
        - variables:
            room_definition: >-
              {{ room_definition | combine({
                "todo_item": items_to_clean[todo_list_entity]['items'][repeat.index - 1].summary,
                "threshold_area": room_definition.threshold_area | default(-1),
                "is_todo": items_to_clean[todo_list_entity]['items'][repeat.index - 1].status == 'needs_action',
                "cleaned_area": room_definition.cleaned_area | default(0),
                "cleaning_priority": room_definition.cleaning_priority | default(-1),
                "last_complete_clean": room_definition.last_complete_clean | default("1970-01-01T00:00:00.000000+00:00")
                }) 
              }}
        # FIX: Nur schreiben, wenn sich wirklich etwas geaendert hat. Vorher
        # wurden bei JEDEM Trigger (u.a. bei jeder Flaechenaenderung) alle
        # ToDo-Eintraege neu geschrieben. Das saettigte die queued-Queue, so
        # dass Watchdog- und Personen-Trigger verworfen wurden.
        - if:
            - condition: template
              value_template: "{{ room_definition != all_room_definitions[repeat.index - 1] }}"
          then:
            - data:
                item: "{{ room_definition.todo_item }}"
                description: "{{ room_definition | to_json }}"
              action: todo.update_item
              target:
                entity_id: "{{ todo_list_entity }}"
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: "{{ todo_list_entity }}"
    response_variable: items_to_clean 
  - variables:
      all_room_definitions: >-
              {{ items_to_clean[todo_list_entity]['items']| map(attribute='description') | map('from_json') | list }}
      all_rooms_to_clean: "{{ all_room_definitions | selectattr('is_todo','eq', true) | list}}"
      # FIX: current_room wurde bisher aus der *ersten*, noch nicht
      # normalisierten Raumliste bestimmt (ohne todo_item/threshold_area).
      current_room: "{{ all_room_definitions | selectattr('id','eq',current_room_id) | first | default({}, true) }}"
  - choose:
      - conditions:
          - condition: trigger
            id:
              - area-change
        sequence:
          - if:
              - condition: template
                value_template: "{{ (states(cleaned_area_entity) | float(-1)) == 0 }}"
            then:
              # FIX: Bisher wurden nur die offenen Raeume zurueckgesetzt. Ein
              # bereits abgeschlossener Raum konnte so ein altes
              # stop=true / executed=false behalten und bei der naechsten
              # Reinigung am selben Tag einen sofortigen Stop ausloesen.
              # post_actions wird jetzt fuer alle Raeume geleert, die
              # Fortschrittswerte weiterhin nur fuer die zu reinigenden.
              - repeat:
                  count: "{{ all_room_definitions | count }}"
                  sequence:
                    - variables:
                        room_base: "{{ all_room_definitions[repeat.index - 1] }}"
                        room_definition: >-
                          {{ room_base | combine({
                              "last_clean_cycle": clean_cycle,
                              "post_actions": {
                                "executed": false
                              }
                            })
                            | combine(
                              {
                                "cleaned_area": 0,
                                "progress": 0,
                                "self_clean_initiated": false
                              } if (room_base.is_todo | default(false)) else {}
                            )
                          }}
                    - action: todo.update_item
                      data:
                        item: "{{ room_definition.todo_item}}"
                        description: "{{ room_definition | to_json }}"
                      target:
                        entity_id: "{{ todo_list_entity }}"
            else:
              - if:
                  - condition: template
                    value_template: "{{ states(vacuum_entity) == 'cleaning' }}"
                then:
                  - variables:
                      prev_cleaned_area: "{{ current_room.cleaned_area | default(0) }}"
                  - variables:
                      diff_area: "{{ (trigger.to_state.state | float) - (trigger.from_state.state | float) }}"
                      current_room: >
                        {{ current_room | combine({
                            "cleaned_area": prev_cleaned_area + diff_area,
                            "progress": min(100, ((prev_cleaned_area + diff_area) / current_room.threshold_area) * 100),
                            "last_clean": now().isoformat()
                          })
                        }}
                      area_done: "{{ current_room.cleaned_area >= current_room.threshold_area }}"
                      new_item_status: >
                        {% if(area_done) %}
                          completed
                        {% else %}
                          needs_action
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: "{{ area_done }}"
                    then:
                      - variables:
                          current_room: >
                            {{ current_room | combine({
                                "last_complete_clean": current_room.last_clean,
                                "occupancy_minutes": 0,
                                "last_complete_clean_mode": state
                              })
                            }}
                  - action: todo.update_item
                    data:
                      item: "{{ current_room.todo_item}}"
                      description: "{{ current_room | to_json }}"
                      status: "{{ new_item_status }}"
                    target:
                      entity_id: "{{ todo_list_entity }}"  
      - conditions:
          - condition: trigger
            id:
              - new-day
        sequence:
          - target:
              entity_id: "{{ todo_list_entity }}"
            response_variable: todos
            action: todo.get_items
          - variables:
              items: "{{ todos[todo_list_entity]['items'] }}"
              item_count: "{{ items | list | count }}"
          - repeat:
              count: "{{ item_count }}"
              sequence:
                - target:
                    entity_id: "{{ todo_list_entity }}"
                  data:
                    item: "{{ items[repeat.index - 1].summary }}"
                    status: needs_action
                  action: todo.update_item
      - conditions:
          - condition: trigger
            id:
              - start-room-cleaning
        sequence:
          - variables:
              vacuum_device_id: "{{ device_attr(vacuum_entity,'id') }}"
              clean_genius_entity: >-
                {{ device_entities(vacuum_device_id) |
                select('match','select\..*cleangenius') |list |first }}
              customized_cleaning_entity: >-
                {{ device_entities(vacuum_device_id) |
                select('match','switch\..*customized_cleaning') |list |first }}
              cleaning_times_entities: >-
                {{ device_entities(vacuum_device_id) |
                select('match','select\..*room.*_cleaning_times') |list }}
              cleaning_mode_entities: >-
                {{ device_entities(vacuum_device_id) |
                select('match','select\..*room.*_cleaning_mode') |list }}
              cleaning_order_entities: >-
                {{ device_entities(vacuum_device_id) |
                select('match','select\..*room.*_order') |list }}
              rooms: "{{ all_rooms_to_clean }}"
          - action: select.select_option
            metadata: {}
            data:
              option: "off"
            target:
              entity_id: "{{ clean_genius_entity }}"
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          - action: switch.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: "{{ customized_cleaning_entity }}"
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          - if:
            - condition: template
              value_template: "{{ cleaning_order == 'last_complete_clean' }}"
            then:
              - variables:
                  rooms: "{{ rooms | sort(attribute='last_complete_clean') | sort(attribute='cleaning_priority', reverse=true) | list }}"
          - repeat:
              count: "{{ rooms | count }}"
              sequence:
                - variables:
                    room: "{{ rooms[repeat.index - 1] }}"
                    room_id: "{{ room.id }}"
                    cleaning_times_entity: "{{ cleaning_times_entities | select('match','.*room_'+ (room_id | string) +'_.*') | list | first}}"
                    cleaning_mode_entity: "{{ cleaning_mode_entities | select('match','.*room_'+ (room_id | string) +'_.*') | list | first}}"
                    cleaning_mode: "{{ trigger.event.data.preferred_cleaning_mode | default(room.default_cleaning_mode | default('sweeping_and_mopping')) }}"
                    cleaning_order_entity: "{{ cleaning_order_entities | select('match','.*room_'+ (room_id | string) +'_.*') | list | first}}"
                - action: select.select_option
                  metadata: {}
                  data:
                    option: 1x
                  target:
                    entity_id: "{{ cleaning_times_entity }}"
                - action: select.select_option
                  metadata: {}
                  data:
                    option: "{{ cleaning_mode }}"
                  target:
                    entity_id: "{{ cleaning_mode_entity }}"
                - action: select.select_option
                  metadata: {}
                  data:
                    option: "{{ repeat.index }}"
                  target:
                    entity_id: "{{ cleaning_order_entity }}"
          - if:
              - condition: template
                value_template: "{{ (rooms | count) > 0 }}"
            then:
              - choose: []
                default: !input pre_cleaning_actions
              - action: dreame_vacuum.vacuum_clean_segment
                data:
                  segments: >
                    {{ rooms | map(attribute="id") | list }}
                target:
                  entity_id: "{{ vacuum_entity }}"
      - conditions:
          - condition: trigger
            id:
              - occupancy-change
        sequence:
          - variables:
              room: "{{ all_room_definitions | selectattr('occupancy_entity','defined') | selectattr('occupancy_entity','eq',trigger.entity_id) | first | default({}, true) }}"
              above_threshold: false
          - variables:
              room: >
                {{room | combine({ 
                  "occupancy_threshold": (room.occupancy_threshold | default(-1)),
                  "occupancy_minutes": (room.occupancy_minutes | default(0))
                })}}
          - if:
              - condition: template
                value_template: "{{ (trigger.to_state.state == 'off') }}"
            then:
              - variables:
                  occupancy_duration: "{{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).seconds / 60) | round(2) }}"
                  room: >
                    {{room | combine({ 
                      "occupancy_minutes": (room.occupancy_minutes + occupancy_duration) | round(2)
                    })}}
                  above_threshold: "{{ room.occupancy_minutes >= (room.occupancy_threshold | float(0)) }}"
          - if:
              - condition: template
                value_template: "{{ above_threshold }}"
            then:
              - action: todo.update_item
                data:
                  item: "{{ room.todo_item}}"
                  description: "{{ room | to_json }}"
                  status: "needs_action"
                target:
                  entity_id: "{{ todo_list_entity }}"
            else:
              - action: todo.update_item
                data:
                  item: "{{ room.todo_item}}"
                  description: "{{ room | to_json }}"
                target:
                  entity_id: "{{ todo_list_entity }}"            
      - conditions:
          - condition: trigger
            id:
              - persons-change-leave
              - persons-change-enter
          - condition: template
            value_template: "{{ home_zone not in [none, '', []] }}"
        sequence:
            - variables:
                home_zone_lat: "{{ state_attr(home_zone, 'latitude') | float(none) }}"
                home_zone_lon: "{{ state_attr(home_zone, 'longitude') | float(none) }}"
                home_zone_radius: "{{ state_attr(home_zone, 'radius') | float(100) }}"
                # FIX: a person entity's state is the zone's *friendly name*,
                # not the entity slug (only zone.home resolves to 'home').
                home_zone_state: >-
                  {{ 'home' if home_zone == 'zone.home'
                     else (state_attr(home_zone, 'friendly_name') or home_zone.split('.')[-1]) }}
                zone_has_coords: >-
                  {{ state_attr(home_zone, 'latitude') is not none
                     and state_attr(home_zone, 'longitude') is not none }}
            # FIX: distance() returns km OR miles depending on the configured
            # unit system and is rounded to 2 decimals (= 10 m resolution when
            # metric). Radius and gps_accuracy are always metres, so the old
            # `* 1000` was both unit-dependent and imprecise. We compute the
            # distance in metres ourselves (equirectangular approximation, more
            # than accurate enough for zone-sized radii).
            # FIX: no to_json/from_json round-trip -> the rendered string is
            # already coerced back into a native dict by HA, so from_json would
            # receive a dict and raise ValueError.
            - variables:
                zone_counts: >-
                  {% set ns = namespace(from_count=0, to_count=0) %}
                  {% for p in persons %}
                    {% set is_trig = (p == trigger.entity_id) %}
                    {% for phase in ['from', 'to'] %}
                      {% if is_trig %}
                        {% set st = trigger.from_state if phase == 'from' else trigger.to_state %}
                      {% else %}
                        {% set st = states[p] %}
                      {% endif %}
                      {% set lat = (st.attributes.get('latitude') if st else none) %}
                      {% set lon = (st.attributes.get('longitude') if st else none) %}
                      {% set acc = (st.attributes.get('gps_accuracy', 0) if st else 0) | float(0) %}
                      {% if zone_has_coords and lat is not none and lon is not none %}
                        {% set dlat = ((lat | float(0)) - home_zone_lat) * pi / 180 %}
                        {% set dlon = ((lon | float(0)) - home_zone_lon) * pi / 180 %}
                        {% set mlat = ((lat | float(0)) + home_zone_lat) * pi / 360 %}
                        {% set dist = 6371000 * sqrt((dlon * cos(mlat)) ** 2 + dlat ** 2) %}
                        {% set inside = (dist - acc) < home_zone_radius %}
                      {% else %}
                        {% set inside = (st.state == home_zone_state) if st else false %}
                      {% endif %}
                      {% if inside %}
                        {% if phase == 'from' %}
                          {% set ns.from_count = ns.from_count + 1 %}
                        {% else %}
                          {% set ns.to_count = ns.to_count + 1 %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                  {{ {"from": ns.from_count, "to": ns.to_count} }}
            - variables:
                from_person_count: "{{ zone_counts['from'] | int(0) }}"
                to_person_count: "{{ zone_counts['to'] | int(0) }}"
            - if:
              - condition: template
                value_template: "{{ trigger.id == 'persons-change-enter' and from_person_count == 0 and to_person_count > 0 and states(vacuum_entity) == 'cleaning' }}"
              then:
                # FIX: Das Stop-Flag wird jetzt IMMER gesetzt, nicht nur beim
                # Aufschieben. Falls return_to_base wirkungslos bleibt, greifen
                # dadurch Raumwechsel-Handler und Watchdog als Wiederholung.
                # Ist current_room unbekannt, kann nicht aufgeschoben werden ->
                # es wird sofort gestoppt.
                - variables:
                    can_defer: >-
                      {{ (current_room.todo_item is defined)
                         and ((current_room.progress | default(0)) > continue_room_threshold) }}
                - if:
                    - condition: template
                      value_template: "{{ current_room.todo_item is defined }}"
                  then:
                    - variables:
                        current_room: >                     
                          {{
                            current_room | combine({ 
                              "post_actions": current_room.post_actions | default({}) | combine({
                                "stop": true
                              })
                            })
                          }}
                    - action: todo.update_item
                      data:
                        item: "{{ current_room.todo_item}}"
                        description: "{{ current_room | to_json }}"
                      target:
                        entity_id: "{{ todo_list_entity }}"
                - if:
                    - condition: template
                      value_template: "{{ not can_defer }}"
                  then:
                    - action: vacuum.return_to_base
                      metadata: {}
                      data: {}
                      target:
                        entity_id: "{{ vacuum_entity }}"
            - if:
              - condition: template
                value_template: "{{ trigger.id == 'persons-change-leave' and from_person_count > 0 and to_person_count == 0 and states(vacuum_entity) != 'cleaning' }}"
              then:
                - event: start-room-cleaning
                  event_data:
                    vacuum: "{{ vacuum_entity }}"
      - conditions:
          - condition: trigger
            id:
              - room-change  
        sequence:
          - variables:
              # FIX: from_state bzw. room_id koennen fehlen (HA-Neustart,
              # Fahrt ausserhalb eines Raums) -> das warf vorher einen
              # Template-Fehler und brach den ganzen Lauf ab.
              prev_room_id: "{{ (trigger.from_state.attributes.get('room_id') if trigger.from_state else none) | int(-1) }}"
              prev_room: "{{ all_room_definitions | selectattr('id','eq',prev_room_id) | first | default({}, true) }}"
              prev_last_complete_clean_mode: "{{ prev_room.last_complete_clean_mode | default('none') }}"
              prev_post: "{{ prev_room.post_actions | default({}) }}"
              prev_room_finished: >-
                {{ (prev_room.cleaned_area | default(0)) >= (prev_room.threshold_area | default(-1)) }}
          - variables:
              # FIX: Der Stop haengt NICHT mehr an prev_room_finished. Wurde das
              # Aufschieben ueber continue_room_threshold ausgeloest, ist der
              # Raum per Definition noch nicht fertig (progress < 100) - die
              # alte Bedingung war damit nie erfuellt und es wurde nie gestoppt.
              stop_pending: >-
                {{ (prev_post.stop | default(false)) and not (prev_post.executed | default(false)) }}
              run_finish_actions: >-
                {{ prev_room_finished and not (prev_post.executed | default(true)) }}
          # 1) Stop - unabhaengig vom Fertig-Status des Raums
          - if:
              - condition: template
                value_template: "{{ stop_pending }}"
            then:
              - action: vacuum.return_to_base
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ vacuum_entity }}"
          # 2) Self Clean - nur wenn der Raum wirklich fertig wurde und nicht gestoppt wird
          - if:
              - condition: template
                value_template: >-
                  {{ run_finish_actions and not stop_pending
                     and (prev_room.self_clean_afterwards | default(false))
                     and cleaning_progress < skip_self_clean_progress_threshold
                     and ('mopping' in prev_last_complete_clean_mode) }}
            then:
              - action: button.press
                target:
                  entity_id: "{{ self_clean_entity }}"
                data: {}
          # 3) executed persistieren
          - if:
              - condition: template
                value_template: "{{ (stop_pending or run_finish_actions) and (prev_room.todo_item is defined) }}"
            then:
              - variables:
                  prev_room: >
                    {{prev_room | combine({ 
                      "post_actions": prev_post | combine({ 
                        "executed": true
                      })
                    })}}
              - action: todo.update_item
                data:
                  item: "{{ prev_room.todo_item}}"
                  description: "{{ prev_room | to_json }}"
                target:
                  entity_id: "{{ todo_list_entity }}"
          # 4) Benutzer-Aktionen fuer den fertigen Raum
          - if:
              - condition: template
                value_template: "{{ run_finish_actions }}"
            then:
              - variables:
                  room: "{{prev_room}}"
              - choose: []
                default: !input room_finished_actions
      - conditions:
          - condition: trigger
            id:
              - stop-watchdog
        sequence:
          # FIX: no to_json/from_json round-trip. The rendered '{}' was coerced
          # back into a native dict by HA, so from_json received a dict instead
          # of a string and raised ValueError.
          - variables:
              flagged_room: >-
                {% set ns = namespace(found=none) %}
                {% for r in all_room_definitions %}
                  {% set post = r.get('post_actions', {}) %}
                  {% if (post.get('stop', false)) and not (post.get('executed', true)) and (r.id != current_room_id) %}
                    {% if ns.found is none %}
                      {% set ns.found = r %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.found | default({}, true) }}
          - if:
              - condition: template
                value_template: "{{ (flagged_room.id is defined) and states(vacuum_entity) == 'cleaning' }}"
            then:
              - action: vacuum.return_to_base
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ vacuum_entity }}"
              - variables:
                  flagged_room: >
                    {{ flagged_room | combine({
                        "post_actions": flagged_room.post_actions | combine({"executed": true})
                      })
                    }}
              - action: todo.update_item
                data:
                  item: "{{ flagged_room.todo_item }}"
                  description: "{{ flagged_room | to_json }}"
                target:
                  entity_id: "{{ todo_list_entity }}"
mode: queued
# FIX: Standard waere max 10. Bei vielen Raeumen und haeufigen
# Flaechen-Updates lief die Queue voll und Trigger wurden verworfen.
max: 25
